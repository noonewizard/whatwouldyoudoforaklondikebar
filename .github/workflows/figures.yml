# DELIVERABLE 14 & 37 — FIGURE CI/CD
name: figures

on:
  push:
    paths: ['illustrations/**', 'book*/manuscript/**', '.github/workflows/figures.yml']
  pull_request:
    paths: ['illustrations/**', 'book*/manuscript/**']

jobs:
  register:
    name: Register integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - name: Validate register schema and research-integrity rules
        run: python3 illustrations/scripts/validate_register.py --strict
      - name: Negative controls for the validator
        run: python3 illustrations/scripts/test_validator.py
      - name: Every registered figure has its declared export files
        run: python3 illustrations/scripts/check_files.py
      - name: Every figure directory has a provenance record
        run: python3 illustrations/scripts/check_provenance.py

  references:
    name: Cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - name: No hand-written "Figure N" in prose
        run: |
          if grep -rEn '\bFigure [0-9]' book*/chapters/ book*/appendices/ 2>/dev/null \
             | grep -v '^\S*:.*Figure [0-9]\+\.[0-9]\+ —'; then
            echo "::error::Hand-written figure numbers found. Use @fig- labels."
            exit 1
          fi
      - name: Every @fig- label in prose exists in the register
        run: python3 illustrations/scripts/check_labels.py

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - name: Alt text present, bounded, and not a caption copy
        run: python3 illustrations/scripts/check_alt_text.py
      - name: Long descriptions present where required
        run: python3 illustrations/scripts/check_longdesc.py

  palette:
    name: Palette validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Print palette must pass at --pairs all
        run: |
          node tools/validate_palette.js \
            "#3A5FA8,#C08420,#0E8C72,#A83A33" \
            --mode light --surface "#FAF8F4" --pairs all
      - name: Dark palette must pass at --pairs all
        run: |
          node tools/validate_palette.js "#C2635C,#6A8CD4" \
            --mode dark --surface "#1C1B19" --pairs all

  reproducibility:
    name: Computational figures regenerate identically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml matplotlib
      - name: Regenerate and diff every computational figure
        run: python3 illustrations/scripts/check_reproducible.py
      - name: Re-run the series' own verification scripts
        run: |
          for s in book*/research/computational_verification/*.py; do
            echo "── $s"; python3 "$s" > /dev/null || exit 1
          done

  render:
    name: Build
    runs-on: ubuntu-latest
    needs: [register, references, accessibility, palette]
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with: {tinytex: false}
      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin
      - run: quarto render --to typst
      - run: quarto render --to html
      - run: quarto render --to epub
      - uses: actions/upload-artifact@v4
        with:
          name: book-builds
          path: _book/

  print-gate:
    name: Print readiness (tags only)
    if: startsWith(github.ref, 'refs/tags/print-')
    runs-on: ubuntu-latest
    needs: [render, reproducibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - name: No figure may be permission-pending
        run: python3 illustrations/scripts/check_rights.py --block-pending
      - name: Every figure has a completed Visual Argument Audit
        run: python3 illustrations/scripts/check_audits.py
      - name: No expired licenses
        run: python3 illustrations/scripts/check_rights.py --check-expiry
      - name: Grayscale legibility gate
        run: python3 illustrations/scripts/check_grayscale.py
