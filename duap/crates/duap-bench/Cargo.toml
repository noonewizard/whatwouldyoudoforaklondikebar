[package]
name = "duap-bench"
description = "DUAP system-level benchmark harness: throughput, latency, size and cost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "duap-bench"
path = "src/main.rs"

[dependencies]
duap-canon = { path = "../duap-canon", version = "0.1.0" }
duap-crypto = { path = "../duap-crypto", version = "0.1.0" }
duap-model = { path = "../duap-model", version = "0.1.0", features = [
    "insecure-fixed-secret",
] }
duap-auth = { path = "../duap-auth", version = "0.1.0" }
duap-provenance = { path = "../duap-provenance", version = "0.1.0" }
duap-meter = { path = "../duap-meter", version = "0.1.0" }
duap-valuation = { path = "../duap-valuation", version = "0.1.0" }
duap-ledger = { path = "../duap-ledger", version = "0.1.0" }
duap-receipt = { path = "../duap-receipt", version = "0.1.0" }
duap-clearing = { path = "../duap-clearing", version = "0.1.0" }
duap-sdk = { path = "../duap-sdk", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
