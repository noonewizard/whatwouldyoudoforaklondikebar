[package]
name = "duap-valuation"
description = "DUAP valuation: pricing schedules, multipliers, auctions, and royalty-pool distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
duap-canon = { path = "../duap-canon", version = "0.1.0" }
duap-model = { path = "../duap-model", version = "0.1.0" }
duap-meter = { path = "../duap-meter", version = "0.1.0" }
serde.workspace = true
thiserror.workspace = true

# Only the `sensitivity` experiment needs JSON; the library itself does
# not serialise anything to JSON.
serde_json.workspace = true

[[bin]]
name = "sensitivity"
path = "src/bin/sensitivity.rs"

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "valuation_bench"
harness = false
