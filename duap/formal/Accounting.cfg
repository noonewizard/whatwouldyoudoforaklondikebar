SPECIFICATION Spec

CONSTANTS
  MaxAmount  = 3
  MaxEntries = 3
  MaxAccrual = 25

\* The model is deliberately bounded: once MaxEntries entries are posted and
\* MaxAccrual has been accrued and settled down to a sub-unit remainder, no
\* action is enabled. That terminal state is the intended end of the
\* exploration, not a liveness bug, so deadlock checking is off.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT TrialBalanceZero
INVARIANT ValueConserved
INVARIANT RemainderBounded
PROPERTY EntryBalances
