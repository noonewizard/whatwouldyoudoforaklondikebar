SPECIFICATION Spec

CONSTANTS
  MaxOffers = 2
  MaxTime   = 3

CONSTRAINT Bounded

INVARIANT TypeOK
INVARIANT NoGrantWithoutRequest
INVARIANT AcceptanceBindsAnOffer
INVARIANT GrantFollowsAcceptance
INVARIANT TerminalIsAbsorbing
INVARIANT OutcomeIsUnique
INVARIANT NoReplay

\* Deadlock checking is off deliberately. A negotiation that has reached
\* Granted or Closed with the clock at MaxTime has no enabled action, which
\* TLC reports as a deadlock. Here that is the intended outcome -- a
\* finished negotiation is supposed to stop -- and INV-N4
\* (TerminalIsAbsorbing) is the property that asserts it on purpose.
CHECK_DEADLOCK FALSE
