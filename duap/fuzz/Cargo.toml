# Deliberately outside the workspace: the fuzz targets are built with a
# nightly toolchain and sanitizer flags, and pulling them into the main
# workspace would impose that on every ordinary `cargo build`.
[workspace]

[package]
name = "duap-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
duap-canon = { path = "../crates/duap-canon" }
duap-model = { path = "../crates/duap-model" }
duap-crypto = { path = "../crates/duap-crypto" }
duap-auth = { path = "../crates/duap-auth" }
duap-provenance = { path = "../crates/duap-provenance" }
serde_json = "1"

[[bin]]
name = "canon_decode"
path = "fuzz_targets/canon_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canon_roundtrip"
path = "fuzz_targets/canon_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_decode"
path = "fuzz_targets/event_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_view"
path = "fuzz_targets/json_view.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_verify"
path = "fuzz_targets/envelope_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inclusion_proof_verify"
path = "fuzz_targets/inclusion_proof_verify.rs"
test = false
doc = false
bench = false
