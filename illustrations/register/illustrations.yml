figures:

  - figure_id: FIG-04-012
    quarto_label: "@fig-temple-orientation"
    book: 4
    chapter: 36
    title: "Lodge orientation against Temple orientation"
    subtitle: "The sacred pole is reversed"
    figure_class: analytical
    figure_type: architectural-comparison
    evidence_status: conceptual
    interpretation_status: interpretive
    priority: A
    description: >
      Two plans side by side at the same scale. Left: the Jerusalem Temple, entry
      east, innermost sanctuary west. Right: a typical English lodge, Master in
      the east, candidate entering from the west. Sacred pole marked on each.
    purpose: >
      Supports Chapter 36's finding that the lodge's east-west axis is the
      reverse of the Temple's and matches parish-church orientation instead.
    does_not_show: >
      Not a claim that any specific lodge was laid out from a plan. Lodge
      arrangement is described from published ritual sources, not measured
      buildings. The Temple plan is textual, not archaeological.
    sources:
      - citation: "1 Kings 6-7 (Masoretic Text)"
        role: primary
      - citation: "Ezekiel 40-43"
        role: primary
      - citation: "Ringler, The Temple of Solomon, ch. 36"
        role: secondary
    construction:
      creator: "TBD"
      software: [Figma, Illustrator]
      date: NOT_APPLICABLE
      methodology: >
        Both plans drawn to the dimensions stated in the cited texts. No
        dimension is supplied that the sources do not state; unspecified
        elements are omitted rather than inferred.
    rights:
      holder: "Robert E. L. Ringler"
      license: "All rights reserved"
      status: own-work
      attribution: "Original diagram"
    files:
      export_print: "exports/print/FIG-04-012_temple-orientation_print.pdf"
      export_web: "exports/web/FIG-04-012_temple-orientation_web.svg"
    caption: >
      Figure 4.12 - Lodge orientation against Temple orientation. Analytical
      diagram, not a historical claim about any specific building. In the Temple
      accounts, entry is eastern and the innermost sanctuary is at the western
      end; in the English lodge arrangement the place of greatest dignity is the
      east. Drawn from the textual sources named; dashed elements are not
      specified in those sources.
    alt_text: >
      Two plans at the same scale. Left, the Temple: entry east, sanctuary west.
      Right, a lodge: Master east, entry west. Arrows show the sacred pole
      pointing in opposite directions.
    long_description: >
      Two ground plans are set side by side at the same scale. The left plan is
      the Jerusalem Temple as described in 1 Kings 6 and 7: a long rectangle on
      an east-west axis, entered from the east through a porch twenty cubits
      across and ten deep, flanked by two free-standing pillars; the porch opens
      into a hall sixty cubits by twenty; at the western end is the inner
      sanctuary, a cube of twenty cubits. An arrow runs east to west, from the
      entrance toward the sanctuary. The right plan is the English Masonic lodge
      arrangement: a rectangular room with the Worshipful Master's chair in the
      east, the Senior Warden in the west, and the candidate entering at the west
      or north-west. An arrow runs west to east, from the entrance toward the
      Master. The two arrows point in opposite directions. Solid strokes mark
      elements stated in the cited sources; dashed strokes mark the roofs and
      the space above the inner sanctuary, which the texts do not specify.
    cross_references: ["@fig-temple-plan", "@fig-lodge-officers"]
    revision: 0
    date_modified: NOT_APPLICABLE
    status: proposed
    qa_status: not-started
    limitations: >
      Lodge arrangement varies by jurisdiction. The figure shows the English
      arrangement and says so; it is not "the" Masonic lodge.

  - figure_id: FIG-04-031
    quarto_label: "@fig-golden-ratio-controls"
    book: 4
    chapter: 73
    title: "Golden ratio: the Temple against its controls"
    figure_class: computational
    figure_type: control-comparison
    evidence_status: documented
    interpretation_status: descriptive
    priority: A
    description: >
      Histogram of hit counts from 20,000 random 11-value integer sets drawn from
      the Temple's own range, with the Temple's single hit marked, and the ten
      named comparison sets plotted as points.
    purpose: >
      Shows that 95.66 percent of random sets match or beat the Temple's result,
      and that all ten comparison sets score at or above it.
    does_not_show: >
      Not a claim that no ancient building was ever proportioned to phi. It is a
      measurement of what this search method does, not of the Temple.
    sources:
      - citation: "1 Kings 6-7 (Masoretic Text)"
        role: data
      - citation: "Ringler, The Temple of Solomon, Appendix M"
        role: secondary
    data:
      source: "book4/research/computational_verification/golden_ratio_controls.py"
      transformation: "All ordered pairwise ratios; 5% tolerance fixed before the run"
      file: "data/golden_ratio_controls_output.txt"
    construction:
      creator: "TBD"
      software: [Python, matplotlib]
      date: NOT_APPLICABLE
      methodology: "Regenerated directly from the published script output"
      script: "scripts/build.py"
      random_seed: 20260920
      environment: "python3, stdlib only + matplotlib"
    rights:
      holder: "Robert E. L. Ringler"
      license: "All rights reserved"
      status: own-work
      attribution: "Original figure from the author's published script"
    files:
      export_print: "exports/print/FIG-04-031_golden-ratio-controls_print.pdf"
      export_web: "exports/web/FIG-04-031_golden-ratio-controls_web.svg"
    caption: >
      Figure 4.31 - Golden ratio: the Temple against its controls. Computational
      result, reproducible from the script and seed cited. The Temple's stated
      dimensions yield one ratio within five per cent of phi out of 110 ordered
      pairs; 95.66 per cent of random 11-value sets drawn from the same range
      yield at least as many.
    alt_text: >
      Histogram of hit counts from 20,000 random number sets, peaking at three to
      four hits. The Temple's single hit is marked far to the left of the peak.
    long_description: >
      A histogram of hit counts from 20,000 synthetic trials. Each trial drew
      eleven random integers from the range five to sixty, the same count and
      range as the Temple's stated dimensions, and counted how many of the 110
      ordered pairwise ratios fell within five per cent of the golden ratio. The
      distribution runs from zero hits at 4.35 per cent of trials, rising to a
      peak of 18.34 per cent at four hits, then falling away to a maximum
      observed sixteen. The Temple's own result, one hit, is marked with a
      vertical rule well to the left of the peak: 95.66 per cent of random sets
      score at or above it. Ten named comparison sets are plotted as points
      above the histogram, at counts of one to six, mean 3.20; every one of them
      scores at or above the Temple. The set labelled "arbitrary integers one
      through eleven", which describes no building at all, scores four.
    revision: 0
    date_modified: NOT_APPLICABLE
    status: proposed
    qa_status: not-started
