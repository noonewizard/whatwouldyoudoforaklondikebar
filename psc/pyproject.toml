[project]
name = "psc"
version = "0.1.0"
description = "Physical State Compilation -- prototype Physical Synthesis Compiler"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
